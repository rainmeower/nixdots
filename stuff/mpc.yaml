# Theming
font: mononoki nerd font mono 16
background: "#00000000"
color: "#cad3f500"
border: "#b7bdf800"
separator: " ➜ "

border_width: 0
corner_r: 0
padding: 0 # Defaults to corner_r
rows_per_column: 5 # No limit by default
column_padding: 0 # Defaults to padding

# Anchor and margin
anchor: center # One of center, left, right, top, bottom, bottom-left, top-left, etc.
# Only relevant when anchor is not center
margin_right: 0
margin_bottom: 0
margin_left: 0
margin_top: 0

# Permits key bindings that conflict with compositor key bindings.
# Default is `false`.
inhibit_compositor_keyboard_shortcuts: true

menu:

  - key: [ "s", "Mod4+s" ]
    desc: restart song
    cmd: mpc prev && mpc next

  - key: [ "t", "Mod4+t" ]
    desc: toggle player
    cmd: playerctl play-pause

  - key: [ "c", "Mod4+c" ]
    desc: toggle music
    cmd: mpc seek -1 && sleep 0.01 && mpc toggle

  - key: [ "h", "Mod4+h" ]
    desc: prev song
    cmd: mpc prev

  - key: [ "i", "Mod4+i" ]
    desc: next song
    cmd: mpc next

  - key: [ "a", "Mod4+a" ]
    desc: mpd -vol
    cmd: mpc volume -5
    keep_open: true

  - key: [ "e", "Mod4+e" ]
    desc: mpd +vol
    cmd: mpc volume +5
    keep_open: true

  - key: [ "o", "Mod4+o" ]
    desc: clear playlist
    cmd: mpc clear

  - key: [ "u", "Mod4+u" ]
    desc: clear all but current song
    cmd: mpc crop


